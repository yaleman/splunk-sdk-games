
[project]
name = "splunk-sdk-games"
version = "0.1.0"
authors = [{ name = "James Hodgkinson", email = "james@terminaloutcomes.com" }]
requires-python = ">=3.12"
dependencies = ["splunk-sdk>=2.1.1,<3.0.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1", # toml, whyyy
    "ruff>=0.16.4",
    "ty>=0.0.68",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["*.py"]
